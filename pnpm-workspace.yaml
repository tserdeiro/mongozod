packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'

# Exact versions only: `pnpm add` writes `1.2.3`, never `^1.2.3`.
savePrefix: ''

allowBuilds:
  # lefthook installs the git hooks from its postinstall script (lefthook.dev/installation/node).
  lefthook: true
  # Downloads the MongoDB binary the tests run against.
  mongodb-memory-server: true
  # Not needed: Fumadocs MDX runs esbuild from its platform package, an optional dependency, and
  # pnpm fails an install in CI on a build script nobody approved or denied.
  esbuild: false
