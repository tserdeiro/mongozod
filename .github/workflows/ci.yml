name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from `packageManager`, Node.js from `.node-version`, and the dependencies.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      - run: pnpm build
      # Compiles a consumer of the published declarations with TypeScript 5.5, the minimum, and 7.
      - run: pnpm check-dist-types
      # The type instantiations of a typical project, within test/type-cost/budget.json.
      - run: pnpm check-type-cost
      # The examples of the docs and the README compile against the published declarations.
      - run: pnpm check-docs

  test-node:
    name: Test on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum in `engines`, then each newer major with support.
        node: ['22.15.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ matrix.node }}
          require-lockfile: true
      - run: pnpm test

  test-driver-6:
    name: Types and tests with driver 6.20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true
      # The driver of Mongoose 8, the lowest in the peer range, and its bson major, in place of the
      # locked 7.x: bson only serializes the values of its own major.
      - run: pnpm --filter mongozod add -D mongodb@6.20.0 bson@6.10.4
      - run: pnpm check-types
        working-directory: packages/mongozod
      - run: pnpm test
        working-directory: packages/mongozod
      - run: pnpm build
        working-directory: packages/mongozod
      # The published declarations, compiled by a consumer that has driver 6.20.
      - run: pnpm check-dist-types
        working-directory: packages/mongozod

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js still runs the install scripts (lefthook, mongodb-memory-server).
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # `--bun` runs Vitest and the tests on Bun instead of the `node` in its shebang.
      - run: bun --bun vitest run
        working-directory: packages/mongozod
